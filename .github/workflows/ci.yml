name: CI

# Honesty note: jobs that cannot pass yet are gated with continue-on-error and a
# TODO naming the sprint that removes the gate. A green badge that lies is worse
# than no badge. See docs/adr/0017-delivery-model.md.

on:
  push:
    branches: [master, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [master, develop, 'release/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: eventini
          POSTGRES_PASSWORD: eventini_ci
          POSTGRES_DB: eventini_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventini -d eventini_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:8.8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # TODO(EVT-014, sprint 03): remove the `if` once prisma/schema.prisma exists.
      - name: Generate Prisma client
        if: ${{ hashFiles('backend/prisma/schema.prisma') != '' }}
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      # Blocking since EVT-002: strict, noImplicitAny, strictBindCallApply,
      # noUncheckedIndexedAccess and friends are on, and the tree is clean.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

      # Guards against a suite that only contains it.todo. The threshold
      # ratchets DOWN each sprint and never up: 31 at sprint 03, 10 today. The
      # remaining ten are the cross-tenant and forbidden-import placeholders
      # EVT-036 replaces with real assertions, which takes this to 0.
      - name: Placeholder-test budget
        run: |
          MAX_TODOS=10
          FOUND=$(grep -roE '\bit\.todo\b' src test --include='*.ts' | wc -l | tr -d ' ')
          echo "it.todo found: $FOUND (budget: $MAX_TODOS)"
          if [ "$FOUND" -gt "$MAX_TODOS" ]; then
            echo "::error::Placeholder tests increased ($FOUND > $MAX_TODOS). Write real assertions."
            exit 1
          fi

      # These three steps are why the two suites below can pass at all.
      #
      # Until now the job set DATABASE_URL and ran the tests, and nothing in
      # between ever created a table: `prisma:migrate:deploy` lives only in the
      # `migrations` job, which is a different container with its own database.
      # Both suites therefore failed every run, invisibly, because
      # `continue-on-error: true` reported the step as green. "Backend pass"
      # meant lint, typecheck and unit tests — never integration or e2e.
      - name: Prepare the test environment
        run: node scripts/ci/prepare-test-env.mjs
        env:
          CI_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          CI_REDIS_URL: ${{ env.TEST_REDIS_URL }}

      - name: Apply migrations
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      # The suites read seeded roles and permissions — a permission resolved
      # against an unseeded catalogue is an empty set, which looks exactly like
      # a correctly refused authorization.
      # Seeded twice on purpose. The second run carries `--assert-no-op`, which
      # fails if anything changed — the idempotency the seed claims, checked
      # rather than assumed. Running it once proves only that it does not crash.
      - name: Seed the authorization catalogue
        run: |
          npm run db:seed
          npm run db:seed -- --assert-no-op
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          NODE_ENV: test

      - name: Integration tests
        run: npm run test:integration --if-present
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          NODE_ENV: test

      - name: E2E tests
        run: npm run test:e2e --if-present
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          REDIS_URL: ${{ env.TEST_REDIS_URL }}
          NODE_ENV: test

      # Blocking since EVT-018. It was advisory while `tenant-isolation.spec.ts`
      # held two `it.todo`, which is a step that cannot fail and therefore
      # verifies nothing. It now carries the four checks ADR-0003 §4 asks for —
      # including that `PrismaModule` does not export the unguarded client —
      # and every one of them is a rule someone could break by accident.
      - name: Architecture tests
        run: npm test -- --ci --testPathPatterns=__architecture__

      - name: Build
        run: npm run build

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: eventini
          POSTGRES_PASSWORD: eventini_ci
          POSTGRES_DB: eventini_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eventini -d eventini_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # TODO(EVT-014, sprint 03): drop the guard once the schema exists.
      - name: Skip when no schema yet
        id: schema
        run: |
          if [ -f prisma/schema.prisma ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No prisma/schema.prisma yet — migration checks skipped (EVT-014)."
          fi

      # The generated client is git-ignored, and since EVT-017 the integration
      # suite uses it: seed.integration-spec.ts drives the real seed functions
      # rather than re-implementing them in raw SQL, which is the only way the
      # reconciliation logic is actually under test. The other specs talk to
      # `pg` directly, so this job got away without generating until now.
      - name: Generate Prisma client
        if: steps.schema.outputs.present == 'true'
        run: npm run prisma:generate

      - name: Apply migrations on a clean database
        if: steps.schema.outputs.present == 'true'
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_test?schema=public

      # `migrate diff --from-migrations` replays every migration into a shadow
      # database, so one has to exist first: Prisma creates a shadow database
      # itself only for `migrate dev`, not when the URL is supplied.
      - name: Create the shadow database
        if: steps.schema.outputs.present == 'true'
        run: |
          PGPASSWORD=eventini_ci createdb -h localhost -U eventini eventini_shadow || \
            echo "shadow database already present"

      # Fails when schema.prisma and prisma/migrations/ have drifted, i.e. when
      # someone edited the schema without generating the migration.
      - name: Detect schema drift
        if: steps.schema.outputs.present == 'true'
        run: npm run prisma:migrate:diff
        env:
          DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_test?schema=public
          SHADOW_DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_shadow?schema=public

      # Before the integration suite, so the first run seeds a genuinely empty
      # database and the log shows the real creation counts. The suite seeds in
      # its own `beforeAll` — it has to, since a seed's job is to converge
      # rather than to demand a blank slate — so running it first would leave
      # this step with nothing to create and quietly weaken it.
      #
      # The second run carries `--assert-no-op`, which exits non-zero if the
      # seed wrote anything. Without it the step only proved that the script
      # does not crash twice: running a command and reading neither result is
      # not a test of idempotency.
      - name: Seed is idempotent
        if: steps.schema.outputs.present == 'true'
        run: |
          npm run db:seed
          npm run db:seed -- --assert-no-op
        env:
          DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_test?schema=public

      # Constraint tests against the real database: a CHECK, a partial unique
      # index and a trigger can only be verified by asking PostgreSQL.
      - name: Schema constraint tests
        if: steps.schema.outputs.present == 'true'
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://eventini:eventini_ci@localhost:5432/eventini_test?schema=public

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Blocking since EVT-003: the ../types barrel exists, the lib/features
      # cycle is gone and the api-client typing is fixed. 0 errors.
      - name: Typecheck
        run: npm run typecheck

      # Blocking since EVT-005: vitest is configured and --if-present is no
      # longer a fig leaf for a missing script.
      - name: Unit tests
        run: npm test

      # Blocking since EVT-003. The build used to fail outright — first on the
      # missing barrel, then on next-intl prerendering without a locale.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  lua:
    name: Redis Lua scripts
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8.8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping | grep PONG"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install redis-cli
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      # These four scripts are the one deliverable that is genuinely executable
      # today, so it is genuinely executed.
      # See docs/infrastructure/REDIS_KEYS_AND_LUA_SCRIPTS.md section 5.
      - name: All scripts load
        run: |
          for f in scripts/redis/*.lua; do
            sha=$(redis-cli -h localhost SCRIPT LOAD "$(cat "$f")")
            echo "$(basename "$f") -> $sha"
          done

      - name: Rate limiter enforces its limit exactly
        run: |
          NOW=1785268800000
          for i in 1 2 3; do
            R=$(redis-cli -h localhost --eval scripts/redis/rate-limit-sliding-window.lua \
                rl:ci , 3 60000 $((NOW+i)) "m$i" | head -1)
            [ "$R" = "1" ] || { echo "::error::call $i should be allowed, got $R"; exit 1; }
          done
          R=$(redis-cli -h localhost --eval scripts/redis/rate-limit-sliding-window.lua \
              rl:ci , 3 60000 $((NOW+4)) m4 | head -1)
          [ "$R" = "0" ] || { echo "::error::call 4 should be rejected, got $R"; exit 1; }
          echo "rate limiter: 3 allowed, 4th rejected"

      - name: A non-owner cannot release a lock
        run: |
          redis-cli -h localhost --eval scripts/redis/distributed-lock.lua lock:ci , acquire ownerA 30000 >/dev/null
          R=$(redis-cli -h localhost --eval scripts/redis/distributed-lock.lua lock:ci , release ownerB | head -1)
          [ "$R" = "0" ] || { echo "::error::ownerB must not release ownerA's lock"; exit 1; }
          HOLDER=$(redis-cli -h localhost GET lock:ci)
          [ "$HOLDER" = "ownerA" ] || { echo "::error::lock was destroyed by a non-owner"; exit 1; }
          echo "distributed lock: fencing holds"

      - name: A replayed nonce is refused
        run: |
          R1=$(redis-cli -h localhost --eval scripts/redis/anti-replay-claim.lua replay:ci , 90000 dev_01 1785268800000 | head -1)
          R2=$(redis-cli -h localhost --eval scripts/redis/anti-replay-claim.lua replay:ci , 90000 dev_02 1785268800000 | head -1)
          [ "$R1" = "1" ] && [ "$R2" = "0" ] || { echo "::error::replay not detected"; exit 1; }
          echo "anti-replay: first claim wins, replay refused"

  branch-hygiene:
    name: Branch hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The nested web/.git repo would make `web` a gitlink: the push succeeds,
      # GitHub shows an empty clickable folder, and NO frontend source is
      # actually versioned. Silent data loss. See GIT_STRATEGY.md section 12.
      - name: Frontend source is really tracked
        run: |
          COUNT=$(git ls-files web/src | wc -l | tr -d ' ')
          echo "tracked files under web/src: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "::error::web/ looks like a gitlink, not real files. Is web/.git back?"
            exit 1
          fi

      - name: No nested git repositories
        run: |
          NESTED=$(find . -name .git -mindepth 2 -not -path './node_modules/*' \
                   -not -path './*/node_modules/*' || true)
          if [ -n "$NESTED" ]; then
            echo "::error::nested git repository found:"
            echo "$NESTED"
            exit 1
          fi
          echo "no nested git repositories"

      # The classic failure mode of master/develop: a stabilisation fix lands on
      # master and is never merged back, so the bug returns at the next release.
      - name: master is an ancestor of develop
        if: github.ref == 'refs/heads/develop' || github.base_ref == 'develop'
        run: |
          git fetch origin master:refs/remotes/origin/master --quiet || {
            echo "::notice::master does not exist yet — skipping"; exit 0; }
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "master is an ancestor of develop"
          else
            echo "::error::master is NOT an ancestor of develop."
            echo "A release or hotfix was not back-merged. See GIT_STRATEGY.md section 3, step 6."
            exit 1
          fi

      - name: PRs to master come only from release/* or hotfix/*
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: |
          HEAD_REF="${{ github.head_ref }}"
          case "$HEAD_REF" in
            release/*|hotfix/*) echo "source branch '$HEAD_REF' is allowed" ;;
            *) echo "::error::PRs to master must come from release/* or hotfix/*, got '$HEAD_REF'"; exit 1 ;;
          esac

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Every path in the older docs says `api/`. The directory is `backend/`.
      # New documentation must never reintroduce that error.
      - name: No stale api/ directory references
        run: |
          HITS=$(grep -rnE '(^|[^a-z/])api/src/' docs --include='*.md' \
                 | grep -v 'docs/architecture/authentication-folder-migration.md' \
                 | grep -v 'docs/security/AUTHENTICATION_SECURITY_BASELINE.md' \
                 | grep -v 'docs/observability/PINO_LOGGING_SPECIFICATION.md' || true)
          if [ -n "$HITS" ]; then
            echo "::error::New docs reference a non-existent api/ directory. Use backend/."
            echo "$HITS"
            exit 1
          fi
          echo "no stale api/ references outside the three legacy baselines"

      - name: Internal markdown links resolve
        run: |
          FAILED=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oE '\]\((\.\./|\./)[^)#]+' "$file" 2>/dev/null | sed 's/^](//' | while read -r link; do
              target="$dir/$link"
              if [ ! -e "$target" ]; then
                echo "::error file=$file::broken link -> $link"
                echo "BROKEN" >> /tmp/broken.txt
              fi
            done
          done < <(find docs -name '*.md')
          if [ -f /tmp/broken.txt ]; then exit 1; fi
          echo "all relative markdown links resolve"
