name: Security

on:
  push:
    branches: [master, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [master, develop, 'release/**']
  schedule:
    # Weekly, so a newly disclosed CVE surfaces without waiting for a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A committed .env is the single most common way secrets leak from a repo.
      # docker/.env currently holds real Postgres/pgAdmin/Redis passwords.
      - name: No .env files tracked by git
        run: |
          TRACKED=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::.env files are tracked by git:"
            echo "$TRACKED"
            exit 1
          fi
          echo "no .env files tracked"

      # Catches an example secret pasted into a real config, or a placeholder
      # left in place at deploy time. Cross-checked by env validation rule 9.
      - name: No obvious placeholder secrets in source
        run: |
          PATTERNS='(CHANGE_?ME|REPLACE_?ME|your[-_]secret|s3cr3t|password123|admin123)'
          HITS=$(grep -rniE "$PATTERNS" backend/src web/src 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::placeholder secret found in source:"
            echo "$HITS"
            exit 1
          fi
          echo "no placeholder secrets in source"

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      # Critical always blocks. There are none today.
      - name: Audit — critical (blocking)
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=critical

      # EVT-074 resolved every high/critical advisory reachable from a
      # PRODUCTION dependency (js-yaml via @nestjs/swagger, uuid and
      # brace-expansion via exceljs -> archiver -> readdir-glob; postcss via
      # Next's own build pipeline on web) using npm `overrides` scoped to the
      # exact vulnerable path, each verified by actually exercising the code
      # (an exceljs workbook written with conditional formatting -- the one
      # real call site of uuid.v4() -- round-tripped; the Next build emitted
      # 233 KB of real Tailwind CSS through the patched postcss).
      #
      # What remains is an allowlist of GHSA IDs confined to dev tooling with
      # no compatible fix available (ESLint's and Jest's own bundled
      # minimatch@3.x / 9.x pull an old brace-expansion with no patched
      # release on that line -- the fix was a breaking rewrite, not a
      # backport) plus, on web, Next's optional `sharp` (a caret range on a
      # 0.x version structurally excludes the patched minor; native bindings
      # make forcing it too risky to do blind) and `@hono/node-server`
      # (reachable only through the shadcn CLI's optional MCP sub-command,
      # never invoked by anything in this repository).
      #
      # `npm audit` keeps reporting archiver/glob/minimatch/exceljs by name
      # even though they are fixed: a known limitation where it matches a
      # dependency's DECLARED range rather than what `overrides` actually
      # installed. Verified instead by direct inspection --
      # `find node_modules -name brace-expansion` -- confirming exactly one
      # unpatched physical copy per project, both accounted for below.
      #
      # A new advisory outside this allowlist fails the build. See
      # docs/security/THREAT_MODEL.md section 5, RA-10/RA-11/RA-12.
      - name: Audit — high (allowlisted exceptions only)
        working-directory: ${{ matrix.project }}
        run: |
          if [ "${{ matrix.project }}" = "web" ]; then
            ALLOWED="GHSA-mh99-v99m-4gvg GHSA-f88m-g3jw-g9cj GHSA-frvp-7c67-39w9"
          else
            ALLOWED="GHSA-mh99-v99m-4gvg"
          fi

          npm audit --audit-level=high --json > audit-report.json || true

          UNEXPECTED=$(python3 - "$ALLOWED" <<'PY'
          import json, sys

          allowed = set(sys.argv[1].split())
          report = json.load(open("audit-report.json", encoding="utf-8"))
          unexpected = []

          for name, entry in report.get("vulnerabilities", {}).items():
              if entry.get("severity") not in ("high", "critical"):
                  continue
              for via in entry.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  ghsa = (via.get("url") or "").rsplit("/", 1)[-1]
                  if ghsa and ghsa not in allowed:
                      unexpected.append(f"{name}: {via.get('title')} ({ghsa})")

          for line in sorted(set(unexpected)):
              print(line)
          PY
          )

          rm -f audit-report.json

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::New high/critical advisory outside the allowlist:"
            echo "$UNEXPECTED"
            echo "::error::Add it to THREAT_MODEL.md section 5 with a real justification, or fix it."
            exit 1
          fi

          echo "no advisory outside the documented allowlist"

      - name: Lockfile is committed and in sync
        working-directory: ${{ matrix.project }}
        run: |
          test -f package-lock.json || { echo "::error::missing package-lock.json"; exit 1; }
          npm ci --dry-run >/dev/null

  forbidden-patterns:
    name: Forbidden security patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AUTH-INV-001: no web token may ever reach JavaScript-accessible storage.
      - name: No tokens in browser storage
        run: |
          HITS=$(grep -rnE '(localStorage|sessionStorage)\.(set|get)Item\(\s*['"'"'"][^'"'"'"]*([Tt]oken|[Jj]wt|[Aa]uth)' \
                 web/src 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::AUTH-INV-001 violated: token in browser storage"
            echo "$HITS"
            exit 1
          fi
          echo "AUTH-INV-001 holds"

      # trust proxy = true lets anyone forge X-Forwarded-For and bypass every
      # IP-based rate limit. See docs/operations/ENVIRONMENT_VARIABLES.md §8.
      - name: No blanket trust proxy
        run: |
          HITS=$(grep -rnE "trust proxy['\"]\s*,\s*true|set\(\s*['\"]trust proxy['\"]\s*,\s*true" \
                 backend/src 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::trust proxy must be an explicit hop count, never true"
            echo "$HITS"
            exit 1
          fi
          echo "trust proxy is not set to true"

      # Context §11.6 forbids it by default; an exception needs an ADR.
      #
      # web/src/components/ui/ is excluded: it is generated by the shadcn CLI and
      # is regenerated wholesale, so a finding there cannot be fixed in place.
      # The one known occurrence is ChartStyle in chart.tsx, which injects CSS
      # custom properties from a developer-defined ChartConfig.
      # CONSTRAINT: ChartConfig values must never originate from user input.
      # Tracked as RA-9 in docs/security/THREAT_MODEL.md.
      - name: No dangerouslySetInnerHTML in application code
        run: |
          HITS=$(grep -rn 'dangerouslySetInnerHTML' web/src \
                 --exclude-dir=ui 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::error::dangerouslySetInnerHTML is forbidden by default (context §11.6)"
            echo "$HITS"
            exit 1
          fi
          echo "no dangerouslySetInnerHTML in application code"

      # The generated kit is allowed to contain it, but the count must not grow.
      - name: Generated UI kit — dangerouslySetInnerHTML budget
        run: |
          MAX=1
          FOUND=$(grep -rc 'dangerouslySetInnerHTML' web/src/components/ui 2>/dev/null \
                  | awk -F: '{s+=$2} END {print s+0}')
          echo "occurrences in generated kit: $FOUND (budget: $MAX)"
          if [ "$FOUND" -gt "$MAX" ]; then
            echo "::error::budget exceeded — a new occurrence appeared in the generated kit"
            exit 1
          fi

      # Raw SQL is allowed only under explicit review. Flag it so review happens.
      - name: Flag raw SQL for review
        run: |
          HITS=$(grep -rnE '\$queryRaw|\$executeRaw' backend/src 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "::warning::raw SQL present — must be parameterised and reviewed:"
            echo "$HITS"
          else
            echo "no raw SQL"
          fi

      # ADR-0006: organizationId is the only permitted term for the tenant.
      # TODO(sprint 02): make this blocking once the codebase adopts the term.
      - name: Tenant terminology
        continue-on-error: true
        run: |
          HITS=$(grep -rnw 'tenantId' backend/src web/src 2>/dev/null \
                 | grep -v 'TenantContext' | grep -v 'TenantOwnership' || true)
          if [ -n "$HITS" ]; then
            echo "::warning::use organizationId, not tenantId (ADR-0006):"
            echo "$HITS"
          fi

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
