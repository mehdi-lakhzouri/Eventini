name: eventini

services:
  postgres:
    image: postgres:18.4
    container_name: eventini-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - eventini_postgres_18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventini

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: eventini-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - eventini_pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - eventini

  redis:
    image: redis:8.8
    container_name: eventini-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # `maxmemory-policy noeviction` is Redis's default, and it is stated here
    # anyway: under an `allkeys-*` policy Redis would drop the least recently
    # used keys under memory pressure, and a lockout counter or a distributed
    # lock — written once, read rarely — is close to the ideal LRU victim. An
    # eviction must never be able to switch off a security control
    # (REDIS_KEYS_AND_LUA_SCRIPTS.md §2). Memory is bounded by TTLs instead.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - eventini_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventini

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: eventini-backend:local
    container_name: eventini-backend
    restart: unless-stopped
    # Secrets and the ~130 validated variables come from the developer's own
    # backend/.env — the same file `npm run start:dev` uses, so there is one
    # place to keep in sync rather than two.
    env_file:
      - ../backend/.env
    environment:
      # `environment` wins over `env_file`, which is the point: backend/.env
      # points at localhost and the published ports, both wrong from inside
      # the network. Here the service names resolve over Docker DNS and the
      # ports are the containers' own, not the host mappings.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # The image defaults to production, which is right for a deployment and
      # wrong here: production refuses to start without `COOKIE_SECURE=true`
      # and https-only origins (environment rules 2 and 5), and this stack is
      # plain http on localhost. Overriding to development is the honest
      # local setting rather than weakening those rules.
      NODE_ENV: development
      PORT: 3001
      LOG_FORMAT: json
      LOG_PRETTY: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT}
    ports:
      - "${API_PORT}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventini

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Baked in at build time: Next.js inlines NEXT_PUBLIC_* into the
        # client bundle, so this cannot be changed by restarting the
        # container. The browser talks to the published host port, not the
        # Docker-internal one, because the request originates outside the
        # network.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT}/api/v1
    image: eventini-web:local
    container_name: eventini-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${WEB_PORT}:3000"
    # `service_started`, not `service_healthy`: the frontend renders without
    # the API, and gating on it would leave the web container down for the
    # whole time the API takes to validate its environment and connect.
    depends_on:
      - backend
    networks:
      - eventini

networks:
  eventini:
    name: Eventini
    driver: bridge

volumes:
  eventini_postgres_18_data:
    name: eventini_postgres_18_data
  eventini_pgadmin_data:
    name: eventini_pgadmin_data
  eventini_redis_data:
    name: eventini_redis_data
